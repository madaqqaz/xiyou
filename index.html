  <!-- 强制横屏锁定：竖屏手机视口下把 #ndx-lock 旋转 90° 模拟横屏，使横屏游戏在竖屏容器中正常展示。
       微信 WebView 无法调用 screen.orientation.lock，故用 CSS 旋转方案；旋转只作用于 #ndx-lock 内的 #app。
       弹窗遮罩统一挂到 #ndx-modal-host，避免挂载到 body 造成错位。 -->
  <script>
  (function () {
    window.__ndxRotated = false;
    function doFit() {
      var W = window.innerWidth, H = window.innerHeight;
      var lock = document.getElementById('ndx-lock');
      if (!lock) return;
      if (H > W) {
        lock.style.position = 'fixed';
        lock.style.left = '50%';
        lock.style.top = '50%';
        lock.style.width = H + 'px';
        lock.style.height = W + 'px';
        lock.style.margin = '0';
        lock.style.transformOrigin = 'center center';
        lock.style.transform = 'translate(-50%, -50%) rotate(90deg)';
        document.documentElement.style.overflow = 'hidden';
        document.body.style.overflow = 'hidden';
        document.body.classList.add('landscape');
        document.body.classList.add('ndx-rotated');
        lock.classList.add('ndx-rotated');
        window.__ndxRotated = true;
      } else {
        lock.style.position = '';
        lock.style.left = ''; lock.style.top = ''; lock.style.margin = '';
        lock.style.width = ''; lock.style.height = '';
        lock.style.transform = ''; lock.style.transformOrigin = '';
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
        document.body.classList.remove('ndx-rotated');
        lock.classList.remove('ndx-rotated');
        window.__ndxRotated = false;
      }
      if (window.__ndxLandscapeGate) { window.__ndxLandscapeGate(); }
    }
    // 统一横屏门槛：旋转伪横屏或真实横屏（短边 <= 640px）时给 <html> 加 .ndx-short-landscape，
    // 统一横屏 CSS 样式。注：@media (orientation: landscape) 在旋转伪横屏下会失效，故用 JS 门槛（applyShortLandscape）。
    function shortSideLandscape() {
      if (window.__ndxRotated) return true; // 旋转伪横屏：一律按横屏展示
      var W = window.innerWidth, H = window.innerHeight;
      if (W <= H) return false;
      var shortSide = H; // 真实横屏的短边即视口高度
      return shortSide <= 640;
    }
    function applyShortLandscape() {
      var on = shortSideLandscape();
      var h = document.documentElement;
      if (on) { h.classList.add('ndx-short-landscape'); }
      else { h.classList.remove('ndx-short-landscape'); }
      return on;
    }
    window.__ndxLandscapeGate = applyShortLandscape;
    /* 寮圭獥/鍏ㄥ睆閬僵缁熶竴鎸傝浇锛?ndx-modal-host 浣嶄簬 ndx-lock 鍐咃紝涓?#app 鍚屽潗鏍囩郴锛?
       旋转状态下遮罩不会因挂在 body 而错位；未创建时退回 document.body。 */
    window.__ndxOverlay = function (el) {
      var host = document.getElementById('ndx-modal-host');
      (host || document.body).appendChild(el);
      return el;
    };
    function ensureModalHost(lock) {
      if (document.getElementById('ndx-modal-host')) return;
      var host = document.createElement('div');
      host.id = 'ndx-modal-host';
      lock.appendChild(host);
    }
    function init() {
      var app = document.getElementById('app');
      if (!app) { setTimeout(init, 50); return; }
      var lock = document.getElementById('ndx-lock');
      if (lock) { ensureModalHost(lock); doFit(); return; }
      lock = document.createElement('div');
      lock.id = 'ndx-lock';
      lock.className = 'ndx-lock';
      app.parentNode.insertBefore(lock, app);
      lock.appendChild(app);
      ensureModalHost(lock);
      doFit();
    }
    init();
    window.addEventListener('resize', doFit);
    window.addEventListener('orientationchange', function () { setTimeout(doFit, 120); });
    // 兼容部分微信 WebView：init() 同步执行时 innerWidth/innerHeight 可能尚未就位，
    // 故 load 之后再强制执行两次 doFit()，确保旋转与尺寸正确。
    if (document.readyState === 'complete') { setTimeout(doFit, 50); setTimeout(doFit, 400); }
    else { window.addEventListener('load', function () { setTimeout(doFit, 50); setTimeout(doFit, 400); }); }
  })();
  /* 图片格式降级：TapTap/微信等 WebView 支持 webp 时，把同目录 .png/.jpg URL 映射为 .webp（体积更小），
     不支持时用 __pickWebpImgFallback 在 onerror 中把 src 回退为原 png/jpg。 */
  (function () {
    // 鍗曟 webp 鏀寔鎺㈡祴锛堝悓姝ュ畬鎴愶級
    var __webpOk = null;
    function detectWebp() {
      if (__webpOk !== null) return __webpOk;
      try {
        var canvas = document.createElement('canvas');
        canvas.width = 1; canvas.height = 1;
        __webpOk = canvas.toDataURL('image/webp').indexOf('data:image/webp') === 0;
      } catch (e) { __webpOk = false; }
      return __webpOk;
    }
    function pickWebp(url) {
      if (!url || typeof url !== 'string') return url;
      // 宸叉槸 webp / 鍗忚 / data 鐩撮€?
      if (/\.webp($|\?)/i.test(url)) return url;
      if (/^(data:|blob:|about:|http)/.test(url) && url.indexOf('image/') >= 0) return url;
      // Node/CDP 绛夋棤 document 鐜锛坈anvas 鎺㈡祴澶辨晥锛夋椂鐩存帴杩斿洖鍘?URL
      if (typeof document === 'undefined') return url;
      if (!detectWebp()) return url;
      var ext = /\.png$/i;
      if (ext.test(url)) return url.replace(/\.png$/i, '.webp');
      if (/\.jpg$|\.jpeg$/i.test(url)) return url.replace(/\.(jpg|jpeg)$/i, '.webp');
      return url;
    }
    function pickWebpImgFallback(img) {
      try {
        if (!img || !img.src) return false;
        // 单次防重：标记后不再重试，避免 onerror 死循环
        if (img.__webpFb) return false; // 鑻?webp 澶辫触锛宲ng 涔?404 鏃朵笉鍐嶉噸璇?
        img.__webpFb = true;
        var s = String(img.src);
        if (/\.webp($|\?)/i.test(s)) {
          var before = s;
          img.src = s.replace(/\.webp$/i, '.png').replace(/\.webp\?/i, '.png?');
          if (!/\.(png|jpg|jpeg)($|\?)/i.test(img.src)) {
            img.src = s.replace(/\.webp($|\?)/i, '.jpg' + (s.indexOf('?') >= 0 ? (s.match(/\?.*/)[0]) : ''));
          }
          return img.src !== before; // 已成功回退 png/jpg，通知 caller 无需再换 src
        }
        return false; // 闈?webp 涔?404 鏃剁敱 caller 鍏滃簳
      } catch (e) { return false; }
    }
    window.__pickWebp = pickWebp;
    window.__pickWebpImgFallback = pickWebpImgFallback;
  })();
  </script>

  <canvas id="ndx-battle-cv" width="812" height="375" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);max-width:100%;max-height:100%;z-index:9999;background:#000;touch-action:none;" data-page-node-id="IEJYC7AXN04kCEPNgQkVny"></canvas>
  <script>
    // 手机横屏适配：短边 <= 640px 的横屏（含旋转伪横屏）时给 #startscreen 加 ndx-landscape锛?
    // 璁╁紑濮嬪尯锛堝紑濮?缁х画/瑙勫垯锛夎蛋妯睆 CSS 甯冨眬锛涚珫灞?鏅€氬灞忔椂绉婚櫎锛屽厓绱犲洖鍒板師浣嶃€?
    // 璇存槑锛氭棆杞吉妯睆涓?innerWidth/innerHeight 涓虹墿鐞嗙珫灞忓€硷紝椤绘寜鏃嬭浆鍚庣殑灞曠ず鎬佸垽鏂細
    //   a) 鏃嬭浆鎬侊細window.__ndxRotated=true 鏃朵竴寰嬫寜妯睆鐢熸晥锛?
    //   b) 鐪熷疄妯睆锛氬 > 楂?涓?鐭竟(瑙嗗彛楂? <= 640 鏃剁敓鏁堛€?
    // 钀藉湴锛?html> 鎸?.ndx-short-landscape 缁熶竴妯睆 CSS 闂ㄦ帶锛坅pplyShortLandscape锛夈€?
    function isShortLandscapeForUI() {
      if (window.__ndxRotated) return true;
      var vw = window.innerWidth, vh = window.innerHeight;
      // 真实横屏（宽>高）即启用 start-v2 横屏布局，不再限制短边<=640
      // 閬垮厤澶у睆/骞虫澘/妗岄潰娴忚鍣ㄦí缃椂 start 椤典粛璧扮珫鐗堟帓鐗堬紙濡傚浘2锛夈€?
      return vw > vh;
    }
    function applyGlobalGate() {
      // 统一门槛入口：委托给已注册的 window.__ndxLandscapeGate
      if (typeof window.__ndxLandscapeGate === 'function') { window.__ndxLandscapeGate(); }
    }
    function landscapeStart() {
      var sc = document.getElementById('startscreen');
      if (!sc) return;
      var on = isShortLandscapeForUI();
      sc.classList.toggle('ndx-landscape', on);
      // start-v2 鐢?CSS 鍏ㄦ潈鎺ョ甯冨眬锛岀姝?JS 鍐嶅姩 DOM 鍏冪礌
      if (sc.classList.contains('start-v2')) return;
      var bar = sc.querySelector('.ndx-actions');
      var items = [].slice.call(sc.querySelectorAll(
        '.seed-row, .resume-btn, [data-action="start"], .rules-fold'
      ));
      if (on) {
        if (!bar) {
          bar = document.createElement('div');
          bar.className = 'ndx-actions';
          sc.appendChild(bar);
        }
        items.forEach(function (el) {
          if (el.parentNode && el.parentNode !== bar) bar.appendChild(el);
        });
        bar.style.display = 'flex';
      } else if (bar) {
        [].slice.call(bar.children).forEach(function (el) { sc.appendChild(el); });
        bar.parentNode && bar.parentNode.removeChild(bar);
      }
    }
    function lscapeGlobal() { applyGlobalGate(); setTimeout(landscapeStart, 0); }
    function lscape() { setTimeout(landscapeStart, 0); }
    window.addEventListener('resize', function () { lscapeGlobal(); });
    window.addEventListener('orientationchange', function () { setTimeout(applyGlobalGate, 150); setTimeout(lscape, 150); setTimeout(lscapeGlobal, 180); });
    // #startscreen 鐢?ui 娓叉煋锛坕ntro 娴佺▼锛夛紝鍙兘鍦?DOMContentLoaded 鍚庢墠鎸傝浇锛?
    // 故用 MutationObserver 在挂载/加载后补一次 landscape()，避免纺掉时机
    if (window.MutationObserver) {
      var lOb = new MutationObserver(function () {
        applyGlobalGate();
        if (document.getElementById('startscreen')) lscape();
      });
      lOb.observe(document.documentElement, { childList: true, subtree: true });
    } else {
      window.addEventListener('load', function () { applyGlobalGate(); lscape(); });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { applyGlobalGate(); lscape(); });
    } else { applyGlobalGate(); lscape(); }
  </script>

  <script>
  (function () {
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(function (registration) {
            console.log('[PWA] Service Worker 注册成功，作用域:', registration.scope);

            // 监听更新
            registration.addEventListener('updatefound', function () {
              console.log('[PWA] 发现新版本，正在下载...');
              var newWorker = registration.installing;
              newWorker.addEventListener('statechange', function () {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[PWA] 新版本已安装，刷新页面即可生效');
                  // 可以在这里显示更新提示
                  if (window.showPwaUpdateNotification) {
                    window.showPwaUpdateNotification();
                  }
                }
              });
            });

            // 定期检查更新（每小时）
            setInterval(function () {
              registration.update().catch(function () {});
            }, 60 * 60 * 1000);
          })
          .catch(function (error) {
            console.warn('[PWA] Service Worker 注册失败:', error);
          });

        // 监听控制器变化（新版本激活后自动刷新）
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!refreshing) {
            refreshing = true;
            console.log('[PWA] 新版本已激活，页面即将刷新...');
            // 延迟刷新，让用户看到提示
            setTimeout(function () {
              window.location.reload();
            }, 1000);
          }
        });
      });
    } else {
      console.warn('[PWA] 浏览器不支持 Service Worker');
    }
  })();
  </script>
